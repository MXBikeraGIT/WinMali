name: Android CI Bionic
on:
  workflow_dispatch: 
  push:
    branches: [ "bionic-mali-1.0" ]
  pull_request:

permissions:
  contents: write # Crucial: Needed to allow the bot to create a release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone linkernsbypass
      run: |
        mkdir -p app/src/main/cpp/adrenotools/lib
        git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
          app/src/main/cpp/adrenotools/lib/linkernsbypass

    - name: Clone libadrenotools specific commit
      run: |
        rm -rf app/src/main/cpp/adrenotools
        
        git clone https://github.com/Pipetto-crypto/libadrenotools.git \
          app/src/main/cpp/adrenotools

        cd app/src/main/cpp/adrenotools
        git checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b

    - name: Clone linkernsbypass inside adrenotools
      run: |
        mkdir -p app/src/main/cpp/adrenotools/lib
        
        git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
          app/src/main/cpp/adrenotools/lib/linkernsbypass

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
        add-to-path: true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build standard debug variant
      run: ./gradlew assembleStandardDebug

    - name: Create Testing Release and Upload Archive
      uses: softprops/action-gh-release@v2
      with:
        tag_name: testing
        name: "testing"
        body: "env var is RAM_L value measured in megabytes"
        prerelease: false
        files: ./app/build/outputs/apk/standard/debug/app-standard-debug.apk
